name: Un bug
description: Quelque chose ne marche pas comme prévu.
labels: [bug]
body:
  - type: textarea
    id: quoi
    attributes:
      label: Ce qui se passe
      description: Ce que tu as fait, ce que tu as vu, et ce que tu attendais. Une capture d'écran aide beaucoup.
    validations:
      required: true
  - type: input
    id: systeme
    attributes:
      label: Ton ordinateur
      placeholder: "macOS 27, Windows 12, Ubuntu 26.04…"
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Le résultat de `node -v` et de `claude --version`.
